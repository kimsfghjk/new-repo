name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  headless-check:
    name: Headless import + script check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Git LFS assets included)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux editor runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libfontconfig1 libx11-6 libxcursor1 libxext6 libxinerama1 libxrandr2 libxi6 libgl1 libegl1 unzip

      - name: Download Godot ${{ env.GODOT_VERSION }} (mono build)
        run: |
          set -euo pipefail
          ENGINE_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$ENGINE_DIR"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$ENGINE_DIR"
          BIN="$(find "$ENGINE_DIR" -type f -name 'Godot_v*_mono_linux*' | head -n1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      # The Godot AI plugin disables its MCP server in headless launches, so the
      # check below never competes with an editor (or CI) for ports 8000/9500.
      # Classification policy (mirrors tools/check-project.ps1):
      #   HARD   -> parse errors, load failures, and script errors in OUR code: fail
      #   VENDOR -> script errors whose "at:" frame is under addons/ or third_party/: warn only
      # Vendored addons can log editor-only errors on a runner with no user editor
      # settings (dialogue_manager reads "interface/editor/code_font_size", unset in a
      # fresh headless run). The game is unaffected and we do not patch vendored code,
      # so it must not fail the gate. Parse/load failures still always fail.
      - name: Headless import + script load check
        run: |
          set -euo pipefail
          set +e
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --editor --quit > "$RUNNER_TEMP/godot.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/godot.log"

          awk '
            /MCP \| plugin disabled in headless mode/ { next }
            /SCRIPT ERROR/ {
              pending = $0
              frame = ""
              for (k = 0; k < 3; k++) {
                if ((getline nxt) <= 0) break
                if (nxt ~ /^[[:space:]]*at: /) { frame = nxt; break }
              }
              vendored = (frame != "" && frame ~ /(addons|third_party)\//) && (pending !~ /Parse Error/)
              if (vendored) { print "VENDOR\t" pending "  [" frame "]" }
              else { print "HARD\t" pending "  [" frame "]" }
              next
            }
            /Parse Error|ERROR:|Failed to load|Cannot open file|Unable to load/ { print "HARD\t" $0; next }
          ' "$RUNNER_TEMP/godot.log" > "$RUNNER_TEMP/findings.txt"

          HARD=$(grep -c '^HARD' "$RUNNER_TEMP/findings.txt" || true)
          VENDOR=$(grep -c '^VENDOR' "$RUNNER_TEMP/findings.txt" || true)
          echo "hard=$HARD vendor=$VENDOR"
          sed 's/^/  /' "$RUNNER_TEMP/findings.txt"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Godot exited with code $STATUS"
            exit 1
          fi
          if [ "$HARD" -gt 0 ]; then
            echo "::error::Godot reported load/parse errors in project code (see above)"
            exit 1
          fi
          if [ "$VENDOR" -gt 0 ]; then
            echo "::warning::$VENDOR script error(s) inside vendored addons were ignored (see third_party/README.md)"
          fi
          echo "PASS - project imports; no load or parse errors in project code."

      - name: Guard against forbidden tracked files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(\.godot/|export_credentials\.cfg)'; then
            echo "::error::.godot/ or export_credentials.cfg is tracked - see .gitignore"
            exit 1
          fi
          echo "PASS - no editor cache or export credentials in the index."
